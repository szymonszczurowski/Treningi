<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<title>Trening – redukcja</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --border: #383835;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #8f8e86;
    --accent: #3987e5;
    --s1: #3987e5;
    --s2: #d95926;
    --good: #0ca30c;
    --warn: #c98500;
    --danger: #e66767;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f3f0;
      --surface: #fcfcfb;
      --surface-2: #f0efec;
      --border: #dcdbd6;
      --text: #0b0b0b;
      --text-2: #52514e;
      --muted: #77766f;
      --accent: #2a78d6;
      --s1: #2a78d6;
      --s2: #eb6834;
      --good: #008300;
      --warn: #a86f00;
      --danger: #c93a39;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 8;
    background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 760px; margin: 0 auto; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .hbtn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 99px; font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .hbtn.running { border-color: var(--accent); color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    background: none; border: 0; color: var(--muted);
    padding: 10px 2px 12px; font: inherit; font-size: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.tabs button .ico { font-size: 18px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); font-weight: 600; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 15px; margin: 0; }
  p { margin: 6px 0; }
  code { font-size: 13px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grow { flex: 1; }
  button.btn, label.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font: inherit; font-weight: 500; cursor: pointer; min-height: 40px;
  }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger { color: var(--danger); }
  button.btn.small { padding: 5px 10px; min-height: 32px; font-size: 13px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
  .seg button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 10px; padding: 8px 4px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.25;
  }
  .seg button b { display: block; color: var(--text); font-size: 14px; }
  .seg button.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
  .seg button.active b { color: var(--accent); }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 40px; min-width: 0;
  }
  input[type="checkbox"] { min-height: 0; width: 18px; height: 18px; accent-color: var(--accent); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { width: 100%; min-height: 60px; resize: vertical; }
  .ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .ex-target { white-space: nowrap; font-weight: 600; color: var(--text-2); font-size: 14px; }
  .ex-note { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hint {
    margin-top: 8px; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    background: var(--surface-2); color: var(--text-2);
  }
  .hint.up { border-left: 3px solid var(--good); }
  .hint.same { border-left: 3px solid var(--accent); }
  .hint.max { border-left: 3px solid var(--warn); }
  table.sets { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.sets th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 0 4px 4px; }
  table.sets td { padding: 3px 4px; }
  table.sets td.n { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.sets input { width: 100%; text-align: center; font-variant-numeric: tabular-nums; }
  table.sets td.ok { width: 48px; }
  table.sets td.sw { width: 48px; }
  .check, .swb {
    width: 44px; height: 40px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); font-size: 18px; cursor: pointer;
  }
  .swb { font-size: 16px; }
  .swb.on { border-color: var(--accent); color: var(--accent); }
  .check.on { background: var(--good); border-color: var(--good); color: #fff; }
  tr.done input { opacity: .75; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .val small { font-size: 13px; font-weight: 500; color: var(--text-2); }
  .stat .note { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-wrap .grid line { stroke: var(--border); stroke-width: 1; }
  .chart-wrap .baseline { stroke: var(--muted); stroke-width: 1; }
  .tip {
    position: absolute; pointer-events: none; z-index: 3;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    display: none;
  }
  .tip .d { color: var(--muted); margin-bottom: 2px; }
  .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .legend .sw.dot { width: 8px; height: 8px; border-radius: 50%; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; }
  table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.list th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 6px; border-bottom: 1px solid var(--border); }
  table.list td { padding: 7px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: top; }
  table.list td.r, table.list th.r { text-align: right; }
  .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; }
  details.sess { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  details.sess summary { padding: 12px 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  details.sess summary::-webkit-details-marker { display: none; }
  details.sess .body { padding: 0 14px 12px; font-size: 14px; }
  details.sess .body .ex { padding: 4px 0; border-top: 1px solid var(--border); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .timer {
    max-width: 760px; margin: 10px auto 0;
    background: var(--surface-2); border: 1px solid var(--accent); border-radius: 12px;
    padding: 6px 10px; display: none; align-items: center; gap: 8px;
  }
  .timer.show { display: flex; }
  .timer #timerLbl { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timer .t { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 72px; }
  .timer.done { border-color: var(--good); }
  .timer.done .t { color: var(--good); }
  /* stoper */
  .swpanel {
    position: fixed; left: 12px; right: 12px; z-index: 9;
    top: calc(60px + env(safe-area-inset-top));
    max-width: 736px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--accent); border-radius: 16px;
    padding: 14px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .swpanel.show { display: block; }
  .swpanel .big { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: .5px; line-height: 1.1; margin: 6px 0 4px; }
  .swpanel .lbl { text-align: center; color: var(--text-2); font-size: 13px; min-height: 18px; }
  .swpanel .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .swpanel .laps { max-height: 150px; overflow: auto; margin-top: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .swpanel .laps div { display: flex; justify-content: space-between; padding: 4px 2px; border-top: 1px solid var(--border); }
  .plan-table td:first-child { white-space: nowrap; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
    bottom: calc(140px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
  .form-grid label, label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sync-st { background: none; border: 0; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; }
  .sync-st.ok { color: var(--good); }
  .sync-st.err { color: var(--danger); }
  .sync-box { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); margin-top: 10px; }
  .sync-box.err { color: var(--danger); }
  /* edytor planu */
  .pe-ex { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 10px; background: var(--surface-2); }
  .pe-ex input:not([type="checkbox"]) { background: var(--surface); width: 100%; }
  .pe-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .pe-flags { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--text-2); }
  .pe-flags label { display: flex; align-items: center; gap: 6px; }
  .pe-tools { display: flex; gap: 4px; }
  .pe-tools button { min-width: 36px; }
  .badge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Trening</h1>
    <span class="sub">
      <span id="headerSub"></span>
      <button class="hbtn" id="swBtn" title="Stoper">⏱</button>
      <button class="sync-st" id="syncSt" title="Synchronizacja"></button>
    </span>
  </div>
  <div class="timer" id="timer" role="status" aria-live="polite">
    <span class="t" id="timerT">0:00</span>
    <span class="grow small muted" id="timerLbl">Przerwa</span>
    <button class="btn small" id="timerMinus">−15 s</button>
    <button class="btn small" id="timerPlus">+15 s</button>
    <button class="btn small" id="timerStop">Stop</button>
  </div>
</header>

<div class="swpanel" id="swPanel" role="dialog" aria-label="Stoper">
  <div class="row between"><h3>Stoper</h3><button class="x" id="swClose" aria-label="Zamknij stoper">✕</button></div>
  <div class="big" id="swBig">0:00.0</div>
  <div class="lbl" id="swLbl"></div>
  <div class="btns">
    <button class="btn primary" id="swStart">Start</button>
    <button class="btn" id="swLap">Okrążenie</button>
    <button class="btn" id="swReset">Reset</button>
  </div>
  <button class="btn" id="swApply" style="width:100%;margin-top:8px;display:none">Stop i wpisz do serii</button>
  <div class="laps" id="swLaps"></div>
</div>

<main id="view"></main>

<div class="toast" id="toast"></div>

<nav class="tabs" id="tabs">
  <button data-tab="trening"><span class="ico">🏋️</span>Trening</button>
  <button data-tab="historia"><span class="ico">📅</span>Historia</button>
  <button data-tab="postep"><span class="ico">📈</span>Postęp</button>
  <button data-tab="waga"><span class="ico">⚖️</span>Waga</button>
  <button data-tab="plan"><span class="ico">📋</span>Plan</button>
</nav>

<script>
"use strict";

/* =====================================================================
   DOMYŚLNY PLAN
   Plan, którego używasz na co dzień, jest zapisany w danych (i w data.json)
   i edytujesz go w zakładce Plan. Ten jest tylko punktem startowym.
   Każde ćwiczenie ma stałe "id" – po nim łączona jest historia.
   ===================================================================== */
const DEFAULT_DAYS = [
  { id: "g1", short: "Góra A", name: "Dzień 1 – Góra A", focus: "klatka", exercises: [
    { id: "g1_bench", name: "Wyciskanie hantli na ławce płaskiej", sets: 4, min: 6, max: 10, rest: 150, note: "Łopatki ściągnięte, hantle do linii klatki" },
    { id: "g1_row1", name: "Wiosłowanie hantlem jednorącz", sets: 4, min: 8, max: 12, rest: 150, side: true, note: "Łokieć do biodra, pauza 1 s u góry" },
    { id: "g1_incl", name: "Wyciskanie hantli – skos dodatni 30°", sets: 3, min: 8, max: 12, rest: 90, note: "Opuszczanie 3 s" },
    { id: "g1_csrow", name: "Wiosłowanie oburącz leżąc na ławce skośnej", sets: 3, min: 10, max: 12, rest: 90, note: "Bez szarpania tułowiem" },
    { id: "g1_lat", name: "Wznosy hantli bokiem", sets: 3, min: 12, max: 20, rest: 60, note: "Ostatnia seria z dropsetem" },
    { id: "g1_ham", name: "A1: Uginanie ramion młotkowe", sets: 3, min: 10, max: 15, rest: 0, note: "Superseria z A2 – bez przerwy" },
    { id: "g1_skull", name: "A2: Wyciskanie francuskie hantli leżąc", sets: 3, min: 10, max: 15, rest: 75, note: "Łokcie nieruchomo" }
  ]},
  { id: "d1", short: "Dół A", name: "Dzień 2 – Dół A", focus: "czworogłowe", exercises: [
    { id: "d1_bss", name: "Przysiad bułgarski", sets: 4, min: 8, max: 12, rest: 150, side: true, note: "Tylna noga na ławce, start od słabszej nogi" },
    { id: "d1_rdl", name: "Rumuński martwy ciąg z hantlami", sets: 4, min: 8, max: 12, rest: 150, note: "Opuszczanie 3 s, pauza 1 s na dole" },
    { id: "d1_goblet", name: "Przysiad goblet „1,5 powt.”, pięty wyżej", sets: 3, min: 10, max: 12, rest: 90, note: "Dół – pół w górę – dół – wstanie = 1 powt." },
    { id: "d1_ht", name: "Hip thrust z hantlem", sets: 3, min: 10, max: 15, rest: 90, note: "Pauza 2 s u góry" },
    { id: "d1_calf", name: "Wspięcia na palce jednonóż", sets: 3, min: 12, max: 20, rest: 60, side: true, note: "Pełne rozciągnięcie na dole" },
    { id: "d1_db", name: "Dead bug", sets: 3, min: 8, max: 10, rest: 45, side: true, bw: true, note: "Lędźwia przy podłodze" }
  ]},
  { id: "g2", short: "Góra B", name: "Dzień 3 – Góra B", focus: "barki i plecy", exercises: [
    { id: "g2_ohp", name: "Wyciskanie hantli nad głowę siedząc", sets: 4, min: 6, max: 10, rest: 150, note: "Oparcie 80–90°, brzuch napięty" },
    { id: "g2_row", name: "Wiosłowanie hantlami oburącz w opadzie", sets: 4, min: 8, max: 12, rest: 150, note: "Tułów ok. 45°, plecy proste" },
    { id: "g2_pu", name: "Pompki z nogami na ławce", sets: 3, min: 10, max: 20, rest: 90, bw: true, note: "Powyżej 20 → pauza 2 s na dole" },
    { id: "g2_pull", name: "Pullover z hantlem w poprzek ławki", sets: 3, min: 10, max: 15, rest: 75, note: "Łokcie lekko ugięte" },
    { id: "g2_rdf", name: "Odwrotne rozpiętki w opadzie", sets: 3, min: 12, max: 20, rest: 60, note: "Lekki ciężar, pełna kontrola" },
    { id: "g2_curl", name: "A1: Uginanie z supinacją na skosie 45°", sets: 3, min: 10, max: 15, rest: 0, note: "Superseria z A2 – bez przerwy" },
    { id: "g2_ext", name: "A2: Wyprost ramion z hantlem nad głową", sets: 3, min: 10, max: 15, rest: 75, note: "Pełne rozciągnięcie tricepsa" }
  ]},
  { id: "d2", short: "Dół B", name: "Dzień 4 – Dół B", focus: "pośladki i dwugłowe", exercises: [
    { id: "d2_slrdl", name: "Rumuński martwy ciąg jednonóż", sets: 4, min: 8, max: 12, rest: 150, side: true, note: "Możesz trzymać się ściany" },
    { id: "d2_lunge", name: "Wykroki w tył z deficytu", sets: 3, min: 10, max: 12, rest: 90, side: true, note: "Przednia stopa 5–10 cm wyżej" },
    { id: "d2_step", name: "Wejścia na ławkę", sets: 3, min: 10, max: 12, rest: 90, side: true, note: "Tylko stabilna ławka, bez odbicia dolną nogą" },
    { id: "d2_sumo", name: "Przysiad sumo z pauzą 2 s", sets: 3, min: 12, max: 15, rest: 75, note: "Kolana na zewnątrz" },
    { id: "d2_slht", name: "Hip thrust jednonóż", sets: 3, min: 10, max: 15, rest: 75, side: true, note: "Hantel na biodrze" },
    { id: "d2_side", name: "Deska bokiem", sets: 3, min: 30, max: 45, rest: 45, side: true, bw: true, unit: "s", note: "Biodra w linii" },
    { id: "d2_legs", name: "Unoszenie nóg leżąc na ławce", sets: 3, min: 10, max: 15, rest: 60, bw: true, note: "Bez odrywania lędźwi" }
  ]}
];
const clone = x => JSON.parse(JSON.stringify(x));

/* ================= STORAGE ================= */
const KEY = "trening-app-v1";
function emptyState() { return { sessions: [], body: [], deleted: [], draft: null, plan: null, settings: { maxDb: 25, startWeight: 97 } }; }
let S = load();
function load() {
  let s;
  try { const raw = localStorage.getItem(KEY); s = raw ? JSON.parse(raw) : null; } catch (e) { s = null; }
  if (!s) return emptyState();
  s = { ...emptyState(), ...s, settings: { ...emptyState().settings, ...(s.settings || {}) } };
  migrate(s);
  return s;
}
/* Uzupełnia stare treningi o nazwy ćwiczeń (migawki), żeby historia
   nie zależała od aktualnego planu. Bezpieczne do wielokrotnego uruchamiania. */
function migrate(s) {
  const known = {};
  DEFAULT_DAYS.forEach(d => d.exercises.forEach(e => { known[e.id] = e; }));
  if (s.plan && s.plan.days) s.plan.days.forEach(d => d.exercises.forEach(e => { known[e.id] = e; }));
  const dayNames = {};

function saveWorkout() {

/* ================= PRZERWA (minutnik) ================= */
let timerEnd = 0, timerIv = null, timerName = "";
function startTimer(sec, name) {
  timerEnd = Date.now() + sec * 1000; timerName = name;
  $("#timer").classList.add("show"); $("#timer").classList.remove("done");
  clearInterval(timerIv); tickTimer(); timerIv = setInterval(tickTimer, 250);
  scheduleRestSounds(sec);
  keepAwake();
}
function tickTimer() {
  const left = Math.round((timerEnd - Date.now()) / 1000);
  const t = Math.max(0, left);
  $("#timerT").textContent = `${Math.floor(t / 60)}:${pad(t % 60)}`;
  $("#timerLbl").textContent = left > 0 ? timerName : "Czas na serię!";
  if (left <= 0 && !$("#timer").classList.contains("done")) {
    $("#timer").classList.add("done");
    try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {}
  }
  if (left < -30) stopTimer();
}
function stopTimer() { clearInterval(timerIv); clearScheduledSounds(); $("#timer").classList.remove("show", "done"); }

/* ---- dźwięk ----
   Przeglądarki w telefonach grają dźwięk tylko z kontekstu audio "odblokowanego" dotknięciem.
   Kontekst tworzymy przy pierwszym dotknięciu ekranu, a sygnały końca przerwy planujemy
   z góry w AudioContext – zagrają we właściwym momencie, nawet gdy JS jest spowolniony. */
let actx = null, scheduled = [];
const soundOn = () => S.settings.sound !== false;
function audioCtx() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  const ctx = audioCtx(); if (!ctx) return;
  try { const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); } catch (e) {}
}
document.addEventListener("pointerdown", unlockAudio, { capture: true });
document.addEventListener("touchend", unlockAudio, { capture: true });
function tone(ctx, at, freq, dur, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.start(at); o.stop(at + dur + 0.03); scheduled.push(o);
}
function clearScheduledSounds() { scheduled.forEach(o => { try { o.stop(); o.disconnect(); } catch (e) {} }); scheduled = []; }
function scheduleRestSounds(secLeft) {
  clearScheduledSounds();
  if (!soundOn()) return;
  const ctx = audioCtx(); if (!ctx) return;
  const t0 = ctx.currentTime;
  [3, 2, 1].forEach(k => { if (secLeft - k > 0.2) tone(ctx, t0 + secLeft - k, 660, 0.12, 0.35); });
  const end = t0 + Math.max(0.05, secLeft);
  tone(ctx, end, 880, 0.22, 0.6); tone(ctx, end + 0.3, 880, 0.22, 0.6); tone(ctx, end + 0.6, 1175, 0.45, 0.6);
}
function testSound() { const ctx = audioCtx(); if (!ctx) { toast("Ta przeglądarka nie obsługuje dźwięku"); return; } const t = ctx.currentTime + 0.05; tone(ctx, t, 880, 0.22, 0.6); tone(ctx, t + 0.3, 880, 0.22, 0.6); tone(ctx, t + 0.6, 1175, 0.45, 0.6); }

let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
function releaseAwake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

const SW_KEY = "trening-app-stopwatch";
let SW = (() => { try { return { running: false, startAt: 0, acc: 0, laps: [], target: null, label: "", ...JSON.parse(localStorage.getItem(SW_KEY) || "{}") }; } catch (e) { return { running: false, startAt: 0, acc: 0, laps: [], target: null, label: "" }; } })();
function swSave() { try { localStorage.setItem(SW_KEY, JSON.stringify(SW)); } catch (e) {} }
const swElapsed = () => SW.acc + (SW.running ? Date.now() - SW.startAt : 0);
function fmtSw(ms) { const t = Math.floor(ms / 100); const ds = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600) % 60, h = Math.floor(t / 36000); return (h ? `${h}:${pad(m)}` : `${m}`) + `:${pad(s)}.${ds}`; }
function swOpen() { $("#swPanel").classList.add("show"); tickStopwatch(); }
function swClose() { $("#swPanel").classList.remove("show"); }

  else { SW.startAt = Date.now(); SW.running = true; }

}
function swReset() { SW = { running: false, startAt: 0, acc: 0, laps: [], target: null, label: "" }; swSave(); tickStopwatch(); if (tab === "trening") renderWorkout($("#view")); }
function swLap() { const t = swElapsed(); if (!t) return; SW.laps.unshift(t); swSave(); tickStopwatch(); }

}

  const t = swElapsed(); const tg = SW.target;
  SW.acc = t; SW.running = false;
  if (tg && tg.kind === "set" && S.draft && S.draft.data[tg.ex] && S.draft.data[tg.ex][tg.i]) {
    const st = S.draft.data[tg.ex][tg.i];
    st.reps = String(Math.round(t / 1000)); st.done = true; save();
    const ex = EX[tg.ex];

  } else if (tg && tg.kind === "cardio" && S.draft) {

}
function tickStopwatch() {
  const t = swElapsed();
  $("#swBig").textContent = fmtSw(t);

  const b = $("#swBtn");

/* ================= CHART ================= */
function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let x = lo; x <= hi + step / 2; x += step) t.push(+x.toFixed(6));
  return t;
}
function lineChart(el, series, opts = {}) {
  const pts = series.flatMap(s => s.points);
  if (!pts.length) { el.innerHTML = `<div class="empty">${esc(opts.empty || "Brak danych do wykresu.")}</div>`; return; }
  const W = Math.max(300, el.clientWidth || 600), H = opts.height || 230;
  const m = { t: 12, r: 14, b: 26, l: 42 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = pts.map(p => parseDate(p.date).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
  const ys = pts.map(p => p.y);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const padY = (yMax - yMin) * 0.08 || Math.max(1, yMax * 0.05);
  const ticks = niceTicks(yMin - padY, yMax + padY, 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = t => m.l + (t - x0) / (x1 - x0) * iw;
  const Y = y => m.t + ih - (y - y0) / (y1 - y0) * ih;
  const yf = opts.yFmt || (v => fmt(v));
  const nX = Math.min(5, Math.max(2, Math.floor(iw / 90)));
  const xt = []; for (let i = 0; i < nX; i++) xt.push(x0 + (x1 - x0) * i / (nX - 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Wykres")}">`;
  svg += `<g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>`;
  svg += `<g class="axis">${ticks.map(t => `<text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yf(t))}</text>`).join("")}`;
  svg += xt.map((t, i) => { const d = new Date(t); return `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nX - 1 ? "end" : "middle"}">${d.getDate()}.${pad(d.getMonth() + 1)}</text>`; }).join("") + `</g>`;
  svg += `<line class="baseline" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  series.forEach(s => {
    const sp = [...s.points].sort((a, b) => a.date.localeCompare(b.date));
    if (s.line !== false && sp.length > 1) {
      svg += `<path d="${sp.map((p, i) => `${i ? "L" : "M"}${X(parseDate(p.date).getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    if (s.dots !== false) {
      svg += sp.map(p => `<circle cx="${X(parseDate(p.date).getTime()).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${s.r || 4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" opacity="${s.dotOpacity || 1}"/>`).join("");
    }
  });
  svg += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  svg += `<g class="hdots"></g>`;
  svg += `<rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  svg += `</svg>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><span class="sw ${s.line === false ? "dot" : ""}" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>` : "";
  el.innerHTML = `${legend}<div class="chart-wrap">${svg}<div class="tip"></div></div>`;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = wrap.querySelector(".tip");
  const xh = svgEl.querySelector(".xh"), hd = svgEl.querySelector(".hdots");
  const dates = [...new Set(pts.map(p => p.date))].sort();
  function move(ev) {
    const r = svgEl.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * (W / r.width);
    let best = dates[0], bd = Infinity;
    dates.forEach(d => { const dx = Math.abs(X(parseDate(d).getTime()) - sx); if (dx < bd) { bd = dx; best = d; } });
    const px = X(parseDate(best).getTime());
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
    const rows = []; let dotsSvg = "";
    series.forEach(s => {
      const p = s.points.find(q => q.date === best);
      if (p) {
        rows.push(`<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: <b>${esc(p.label || yf(p.y))}</b></div>`);
        dotsSvg += `<circle cx="${px}" cy="${Y(p.y)}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      }
    });
    hd.innerHTML = dotsSvg;
    tip.innerHTML = `<div class="d">${esc(fmtDate(best))}</div>${rows.join("")}`;
    tip.style.display = "block";
    const scale = r.width / W;
    let left = px * scale + 12;
    if (left + tip.offsetWidth > r.width) left = px * scale - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = "8px";
  }
  function leave() { xh.style.display = "none"; hd.innerHTML = ""; tip.style.display = "none"; }
  const hit = svgEl.querySelector(".hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
}

/* ================= PROGRESS ================= */
let progEx = null, progMetric = null, showAllBody = false;
const METRICS = {
  e1rm: { name: "Szacowany 1RM (kg)", f: e => Math.max(...e.sets.map(s => e1rm(s.kg, s.reps) || 0)) || null, yFmt: v => fmt(v), lbl: v => `${fmt(v)} kg` },
  top: { name: "Najcięższa seria (kg)", f: e => Math.max(...e.sets.map(s => s.kg || 0)) || null, yFmt: v => fmt(v), lbl: v => `${fmt(v)} kg` },
  vol: { name: "Objętość (kg × powt.)", f: e => e.sets.reduce((a, s) => a + (s.kg || 0) * (s.reps || 0), 0) || null, yFmt: v => fmt(v, 0), lbl: v => `${fmt(v, 0)} kg` },
  reps: { name: "Suma powtórzeń / sekund", f: e => e.sets.reduce((a, s) => a + (s.reps || 0), 0) || null, yFmt: v => fmt(v, 0), lbl: v => fmt(v, 0) }
};
function renderProgress(v) {
  const used = usedIds();
  const cat = catalog();
  const archived = [...used].filter(id => !EX[id]);
  if (!progEx || !cat[progEx]) progEx = [...used][0] || DAYS[0].exercises[0].id;
  const ex = EX[progEx] || cat[progEx] || { id: progEx, name: progEx };
  if (!progMetric || (ex.bw && progMetric !== "reps")) progMetric = ex.bw ? "reps" : "e1rm";
  const opt = e => `<option value="${esc(e.id)}" ${e.id === progEx ? "selected" : ""}>${esc(e.name)}${used.has(e.id) ? "" : " (brak danych)"}</option>`;

  const metricOpts = Object.entries(METRICS).filter(([k]) => !ex.bw || k === "reps").map(([k, m]) => `<option value="${k}" ${k === progMetric ? "selected" : ""}>${esc(m.name)}</option>`).join("");

  const hist = [...S.sessions].sort((a, b) => a.date.localeCompare(b.date))
    .map(s => ({ s, e: s.exercises.find(e => e.id === progEx) })).filter(x => x.e && x.e.sets.length);
  const M = METRICS[progMetric];
  const byDate = {};
  hist.forEach(({ s, e }) => { const y = M.f(e); if (y && (!byDate[s.date] || y > byDate[s.date].y)) byDate[s.date] = { date: s.date, y, label: M.lbl(y) }; });
  const pts = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  let change = "";
  if (pts.length >= 2) {
    const a = pts[0].y, b = pts[pts.length - 1].y, pct = (b - a) / a * 100;

  }
  const best = pts.length ? pts.reduce((m, p) => p.y > m.y ? p : m) : null;
  const names = [...new Set(hist.map(h => h.e.name).filter(Boolean))];

  v.innerHTML = `
    <h2>Postęp w ćwiczeniach</h2>
    <div class="card">
      <div class="form-grid">
        <label>Ćwiczenie<select id="pEx">${opts}</select></label>
        <label>Miara<select id="pM">${metricOpts}</select></label>
      </div>
      ${!EX[progEx] ? `<p class="small muted" style="margin-top:8px">To ćwiczenie nie jest już w planie – historia została zachowana.</p>` : ""}
      ${names.length > 1 ? `<p class="small muted" style="margin-top:8px">Wcześniejsze nazwy: ${esc(names.filter(n => n !== ex.name).join(", "))}</p>` : ""}
    </div>
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat"><div class="lbl">Treningi z tym ćwiczeniem</div><div class="val">${hist.length}</div></div>
      ${best ? `<div class="stat"><div class="lbl">Najlepszy wynik</div><div class="val">${esc(M.lbl(best.y))}</div><div class="note">${esc(fmtDate(best.date))}</div></div>` : ""}
      ${change}
    </div>
    <div class="card"><h3>${esc(ex.name)}</h3><div class="small muted" style="margin-bottom:8px">${esc(M.name)}</div><div id="pChart"></div></div>
    <div class="card">
      <h3>Wszystkie serie</h3>
      ${hist.length ? `<table class="list" style="margin-top:6px"><thead><tr><th>Data</th><th>Serie</th></tr></thead><tbody>
        ${[...hist].reverse().map(({ s, e }) => `<tr><td>${esc(fmtDate(s.date))}</td><td>${e.sets.map(st => setTxt(st, e)).join(", ")}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">Jeszcze nie zapisałeś tego ćwiczenia.</div>`}
      ${!ex.bw ? `<p class="small muted" style="margin-top:8px">Szacowany 1RM liczony wzorem Epleya: kg × (1 + powt./30). Przy hantlach to orientacyjna miara postępu, nie realny maks.</p>` : ""}
    </div>

  lineChart($("#pChart"), [{ name: M.name, color: "var(--s1)", points: pts }], { yFmt: M.yFmt, label: `${ex.name}: ${M.name}`, empty: "Zapisz przynajmniej jeden trening z tym ćwiczeniem." });
  const wk = {};
  S.sessions.forEach(s => { const k = dateStr(weekStart(parseDate(s.date))); wk[k] = (wk[k] || 0) + s.exercises.reduce((a, e) => a + e.sets.length, 0); });
  const wpts = Object.entries(wk).sort().map(([date, y]) => ({ date, y, label: `${y} serii (tydzień od ${fmtDate(date)})` }));
  lineChart($("#wkChart"), [{ name: "Serie robocze w tygodniu", color: "var(--s1)", points: wpts }], { yFmt: v => fmt(v, 0), label: "Liczba serii w tygodniu", empty: "Brak treningów." });
  $("#pEx").onchange = e => { progEx = e.target.value; progMetric = null; renderProgress(v); };
  $("#pM").onchange = e => { progMetric = e.target.value; renderProgress(v); };
}

function rollingAvg(entries, days = 7) {
  return entries.map(en => {
    const t = parseDate(en.date).getTime();
    const win = entries.filter(x => { const tx = parseDate(x.date).getTime(); return tx <= t && tx > t - days * 864e5; });
    return { date: en.date, y: win.reduce((a, x) => a + x.kg, 0) / win.length };
  });
}
function renderBody(v) {
  const entries = S.body.filter(b => b.kg != null).sort((a, b) => a.date.localeCompare(b.date));
  const waist = S.body.filter(b => b.waist != null).sort((a, b) => a.date.localeCompare(b.date));
  const avg = rollingAvg(entries);
  let stats = "";
  if (entries.length) {
    const cur = avg[avg.length - 1].y;
    const start = S.settings.startWeight || entries[0].kg;
    const lastT = parseDate(entries[entries.length - 1].date).getTime();
    const prevWin = entries.filter(x => { const t = parseDate(x.date).getTime(); return t <= lastT - 7 * 864e5 && t > lastT - 14 * 864e5; });
    let rate = null;
    if (prevWin.length) rate = cur - prevWin.reduce((a, x) => a + x.kg, 0) / prevWin.length;
    const ratePct = rate != null ? rate / cur * 100 : null;
    let rateNote = "potrzeba min. 2 tygodni pomiarów";
    if (ratePct != null) {
      if (ratePct <= -1.0) rateNote = "szybciej niż 1%/tydz. – rozważ +100–200 kcal";
      else if (ratePct <= -0.5) rateNote = "w celu (0,5–1% tygodniowo)";
      else if (ratePct < 0) rateNote = "wolniej niż cel – możesz odjąć 150–200 kcal";
      else rateNote = "brak spadku – po 2 tyg. odejmij 150–200 kcal";
    }
    stats = `<div class="stat-grid" style="margin-bottom:12px">
      <div class="stat"><div class="lbl">Średnia 7 dni</div><div class="val">${fmt(cur)}<small> kg</small></div><div class="note">ostatni pomiar: ${fmt(entries[entries.length - 1].kg)} kg</div></div>
      <div class="stat"><div class="lbl">Od startu (${fmt(start)} kg)</div><div class="val">${cur - start <= 0 ? "" : "+"}${fmt(cur - start)}<small> kg</small></div></div>
      <div class="stat"><div class="lbl">Tempo tygodniowe</div><div class="val">${rate == null ? "–" : `${rate <= 0 ? "" : "+"}${fmt(rate)}<small> kg</small>`}</div><div class="note">${esc(rateNote)}</div></div>
      ${waist.length ? `<div class="stat"><div class="lbl">Talia</div><div class="val">${fmt(waist[waist.length - 1].waist)}<small> cm</small></div><div class="note">${waist.length > 1 ? `zmiana: ${fmt(waist[waist.length - 1].waist - waist[0].waist)} cm` : "pierwszy pomiar"}</div></div>` : ""}
    </div>`;

  v.innerHTML = `

      <div class="form-grid">

        <label>Talia (cm, opcj.)<input inputmode="decimal" id="bWaist" placeholder="np. 98"></label>
        <button class="btn primary" id="bAdd">Dodaj</button>
      </div>
      <p class="small muted" style="margin-top:8px">Waż się rano, na czczo, po toalecie. Patrz na średnią 7-dniową, nie na pojedynczy wynik.</p>
    </div>
    ${stats}
    <div class="card"><h3 style="margin-bottom:8px">Masa ciała (kg)</h3><div id="bChart"></div></div>
    ${waist.length > 1 ? `<div class="card"><h3 style="margin-bottom:8px">Obwód talii (cm)</h3><div id="wChart"></div></div>` : ""}
    <div class="card">
      <h3>Pomiary</h3>
      ${rows.length ? `<table class="list" style="margin-top:6px"><thead><tr><th>Data</th><th class="r">Waga</th><th class="r">Talia</th><th></th></tr></thead><tbody>
        ${(showAllBody ? rows : rows.slice(0, 14)).map(r => `<tr><td>${esc(fmtDate(r.date))}</td><td class="r">${r.kg != null ? fmt(r.kg) + " kg" : "–"}</td><td class="r">${r.waist != null ? fmt(r.waist) + " cm" : "–"}</td><td class="r"><button class="x" data-bdel="${esc(r.id)}" aria-label="Usuń pomiar">✕</button></td></tr>`).join("")}

      <div class="row" style="margin-top:8px">
        <button class="btn" id="exp">⬇ Eksportuj kopię (JSON)</button>
        <label class="btn">⬆ Importuj kopię<input type="file" id="imp" accept="application/json,.json" class="sr"></label>
        <button class="btn" id="csv">⬇ Serie do CSV</button>
        <button class="btn danger" id="reset">Usuń wszystkie dane</button>
      </div>
    </div>
  `;
  lineChart($("#bChart"), [
    { name: "Pomiar", color: "var(--s1)", points: entries.map(e => ({ date: e.date, y: e.kg, label: `${fmt(e.kg)} kg` })), line: false, r: 4, dotOpacity: 0.85 },
    { name: "Średnia 7 dni", color: "var(--s2)", points: avg.map(a => ({ ...a, label: `${fmt(a.y)} kg` })), dots: false }
  ], { yFmt: v => fmt(v), label: "Masa ciała", empty: "Dodaj pomiary, żeby zobaczyć wykres." });
  if (waist.length > 1) lineChart($("#wChart"), [{ name: "Talia", color: "var(--s1)", points: waist.map(w => ({ date: w.date, y: w.waist, label: `${fmt(w.waist)} cm` })) }], { yFmt: v => fmt(v), label: "Obwód talii" });

  $("#bAdd").onclick = () => {
    const kg = num($("#bKg").value), w = num($("#bWaist").value), date = $("#bDate").value || todayStr();
    if (kg == null && w == null) { toast("Wpisz wagę lub obwód"); return; }
    if (kg != null && (kg < 30 || kg > 300)) { toast("Sprawdź wpisaną wagę"); return; }
    const ex = S.body.find(b => b.date === date);
    const now = new Date().toISOString();
    if (ex) { if (kg != null) ex.kg = kg; if (w != null) ex.waist = w; ex.updatedAt = now; }
    else S.body.push({ id: uid(), date, kg, waist: w, updatedAt: now });
    commit(); toast("Zapisano pomiar"); renderBody(v);
  };
  $("#sStart").onchange = e => { const n = num(e.target.value); if (n) { S.settings.startWeight = n; commit(); renderBody(v); } };
  $("#sSound").onchange = e => { S.settings.sound = e.target.checked; commit(); if (e.target.checked) testSound(); };
  $("#sSoundTest").onclick = testSound;
  $("#sMax").onchange = e => { const n = num(e.target.value); if (n) { S.settings.maxDb = n; commit(); toast("Zapisano"); } };
  bindSyncCard();
  $("#exp").onclick = exportJSON;
  $("#csv").onclick = exportCSV;
  $("#imp").onchange = importJSON;
  $("#reset").onclick = () => {
    if (!confirm("Na pewno usunąć WSZYSTKIE treningi i pomiary" + (syncEnabled() ? " (także w data.json na GitHubie)" : "") + "? Plan zostaje. Tej operacji nie da się cofnąć.")) return;
    const del = [...S.deleted, ...S.sessions.map(x => x.id), ...S.body.map(x => x.id)];

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON() {
  const data = { app: "trening-app", version: 2, exportedAt: new Date().toISOString(), ...pack(S) };
  download(`trening-kopia-${todayStr()}.json`, JSON.stringify(data, null, 2), "application/json");
}
function exportCSV() {
  const lines = [["data", "dzien", "cwiczenie", "seria", "kg", "powtorzenia_lub_sekundy"].join(";")];
  [...S.sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => s.exercises.forEach(e => e.sets.forEach((st, i) => {
    const nm = e.name || exInfo(e.id).name;
    lines.push([s.date, s.dayName || s.day, `"${nm.replace(/"/g, '""')}"`, i + 1, st.kg != null ? String(st.kg).replace(".", ",") : "", st.reps ?? ""].join(";"));
  })));
  download(`trening-serie-${todayStr()}.csv`, "﻿" + lines.join("\n"), "text/csv");
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.sessions) || !Array.isArray(d.body)) throw new Error("format");
      if (!confirm(`Zaimportować ${d.sessions.length} treningów i ${d.body.length} pomiarów${d.plan ? " oraz plan" : ""}? Obecne dane zostaną zastąpione.`)) return;
      migrate(d);
      const del = [...new Set([...S.deleted, ...(d.deleted || []), ...S.sessions.map(x => x.id), ...S.body.map(x => x.id)])]
        .filter(id => !d.sessions.some(x => x.id === id) && !d.body.some(x => x.id === id));
      S = { ...emptyState(), sessions: d.sessions, body: d.body, deleted: del, plan: d.plan ? { ...d.plan, updatedAt: new Date().toISOString() } : S.plan, settings: { ...emptyState().settings, ...(d.settings || {}) } };
      rebuildIndex(); commit(); render(); toast("Zaimportowano dane");
    } catch (err) { toast("To nie jest poprawny plik kopii"); }
  };
  r.readAsText(f);
}

/* ================= PLAN (widok + edytor) ================= */
let planEdit = null; // kopia robocza planu w trybie edycji
let planImportOpen = false, planImportReport = null;

/* ---------- import / eksport planu ----------
   Format pliku planu (JSON):
   { "type": "trening-plan", "version": 1, "name": "…",
     "days": [ { "name": "Dzień 1 – Góra A", "short": "Góra A", "focus": "klatka",
                 "exercises": [ { "name": "…", "sets": 4, "min": 6, "max": 10, "rest": 150,
                                  "note": "…", "side": false, "bw": false, "unit": "s" (opcj.), "id": "…" (opcj.) } ] } ] }
   Ćwiczenia łączą się z historią po "id", a gdy go brak – po nazwie. */
const normName = n => String(n || "").toLowerCase().replace(/^\s*[a-z]\d\s*:\s*/i, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]+/g, " ").trim();
function parsePlanText(text) {
  let t = String(text || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}"), a2 = t.indexOf("[");
  if (a2 !== -1 && (a === -1 || a2 < a)) t = t.slice(a2, t.lastIndexOf("]") + 1); else if (a !== -1) t = t.slice(a, b + 1);
  let d = JSON.parse(t);
  if (Array.isArray(d)) d = { days: d };
  if (d.plan && d.plan.days) d = d.plan;
  if (!Array.isArray(d.days) || !d.days.length) throw new Error("W pliku nie ma listy dni (\"days\").");
  return d;
}
function mapImportedPlan(d) {
  const cat = catalog(); const used = usedIds();
  const byName = {}; Object.values(cat).forEach(e => { const k = normName(e.name); if (k && (!byName[k] || used.has(e.id))) byName[k] = e.id; });
  const seen = new Set(); const rep = { days: 0, ex: 0, matched: [], fresh: [] };
  const N = (v, def) => { const n = num(v); return n == null ? def : n; };
  const days = d.days.map((day, di) => {
    rep.days++;
    const name = String(day.name || `Dzień ${di + 1}`).trim();
    const exercises = (day.exercises || []).filter(e => e && String(e.name || "").trim()).map(e => {
      rep.ex++;
      let id = e.id && cat[e.id] ? e.id : null;
      if (!id) id = byName[normName(e.name)] || null;
      if (!id && e.id && !seen.has(e.id)) id = String(e.id);
      if (!id || seen.has(id)) id = "ex_" + uid();
      seen.add(id);
      (used.has(id) ? rep.matched : rep.fresh).push(String(e.name).trim());
      let min = Math.max(1, N(e.min, 8)), max = Math.max(1, N(e.max, min));
      if (min > max) [min, max] = [max, min];
      const out = { id, name: String(e.name).trim(), sets: Math.max(1, Math.round(N(e.sets, 3))), min, max, rest: Math.max(0, Math.round(N(e.rest, 90))), note: String(e.note || "") };
      if (e.side) out.side = true; if (e.bw) out.bw = true; if (e.unit === "s" || e.timed) out.unit = "s";
      return out;
    });
    const dayId = day.id ? String(day.id) : (DAYS[di] ? DAYS[di].id : "day_" + uid());
    return { id: dayId, name, short: String(day.short || name).trim().slice(0, 12), focus: String(day.focus || ""), exercises };
  });
  const ids = new Set(); days.forEach(x => { if (ids.has(x.id)) x.id = "day_" + uid(); ids.add(x.id); });
  return { days, rep, name: d.name || "" };
}
function exportPlan() {
  const data = { type: "trening-plan", version: 1, name: "Mój plan", exportedAt: new Date().toISOString(),
    days: DAYS.map(d => ({ id: d.id, name: d.name, short: d.short, focus: d.focus || "", exercises: d.exercises.map(e => {
      const o = { id: e.id, name: e.name, sets: e.sets, min: e.min, max: e.max, rest: e.rest, note: e.note || "" };
      if (e.side) o.side = true; if (e.bw) o.bw = true; if (e.unit === "s") o.unit = "s"; return o; }) })) };
  download(`plan-treningowy-${todayStr()}.json`, JSON.stringify(data, null, 2), "application/json");
}
function importPlanFromText(text, v) {
  try {
    const m = mapImportedPlan(parsePlanText(text));
    if (!m.rep.ex) throw new Error("Plan nie zawiera żadnych ćwiczeń.");
    planEdit = m.days; planImportReport = m.rep; planImportOpen = false;
    renderPlan(v); window.scrollTo(0, 0);
  } catch (e) {
    toast(e instanceof SyntaxError ? "To nie jest poprawny plan (błąd JSON)" : e.message);
  }
}
function renderPlan(v) {
  if (planEdit) return renderPlanEditor(v);
  v.innerHTML = `

      </div>
    </div>` : ""}
    <p class="small muted">Zmiana planu nie usuwa historii: każdy zapisany trening pamięta swoje ćwiczenia, a ćwiczenia usunięte z planu dalej mają wykresy w zakładce Postęp.</p>
    ${DAYS.map(d => `<h2>${esc(d.name)}</h2><div class="card"><table class="list"><thead><tr><th>Ćwiczenie</th><th class="r">Serie × powt.</th></tr></thead><tbody>
      ${d.exercises.map(e => `<tr><td>${esc(e.name)}<div class="ex-note">${esc(e.note || "")}</div></td><td class="r" style="white-space:nowrap">${e.sets} × ${e.min}–${e.max}${e.unit === "s" ? " s" : ""}${e.side ? "<br><span class='muted small'>na stronę</span>" : ""}<br><span class="muted small">przerwa ${e.rest ? fmtDur(e.rest) : "–"}</span></td></tr>`).join("")}
    </tbody></table></div>`).join("")}
    <h2>Przykładowy tydzień</h2>
    <div class="card">
      <table class="list plan-table"><tbody>
        <tr><td>Pon</td><td><b>Góra A</b> + 15 min marsz pod górę</td></tr>
        <tr><td>Wt</td><td><b>Dół A</b> + 10 min schłodzenia</td></tr>
        <tr><td>Śr</td><td>35–45 min marsz pod górę (strefa 2)</td></tr>
        <tr><td>Czw</td><td><b>Góra B</b> + 15 min marsz pod górę</td></tr>
        <tr><td>Pt</td><td><b>Dół B</b> + 10 min schłodzenia</td></tr>
        <tr><td>Sob</td><td>Interwały 20–25 min albo 45 min marszu</td></tr>
        <tr><td>Nd</td><td>Odpoczynek, spacer 8–10 tys. kroków</td></tr>
      </tbody></table>
    </div>
    <h2>Zasady</h2>
    <div class="card small">
      <p><b>Rozgrzewka:</b> 5 min marszu na bieżni (3–5%), 3–4 min mobilizacji, 2 serie rozgrzewkowe (50% i 75%) przed pierwszym ćwiczeniem.</p>
      <p><b>Intensywność:</b> kończ serię 1–2 powtórzenia przed upadkiem techniki (RIR 1–2).</p>
      <p><b>Progresja:</b> najpierw powtórzenia do górnej granicy we wszystkich seriach, potem +1–2,5 kg. Na maksymalnym ciężarze: tempo 4 s, pauza, „1,5 powt.”, dodatkowa seria.</p>
      <p><b>Deload:</b> co 6–8 tygodni tydzień z połową serii i RIR 3–4.</p>
      <p><b>Cardio:</b> marsz 5–6 km/h, nachylenie 8–12%, tętno ok. 120–140. Interwały: 8–10 × (30 s szybko + 90 s marszu).</p>
      <p><b>Odżywianie:</b> ok. 2400–2600 kcal, białko 170–190 g. Średnia waga stoi 2 tygodnie → −150–200 kcal.</p>
    </div>
    ${S.plan ? `<p class="small muted">Plan zmieniony: ${esc(new Date(S.plan.updatedAt).toLocaleString("pl-PL"))}</p>` : ""}
  `;
  $("#peStart").onclick = () => { planEdit = clone(DAYS); planImportReport = null; renderPlan(v); };
  $("#piOpen").onclick = () => { planImportOpen = !planImportOpen; renderPlan(v); if (planImportOpen) $("#piText").focus(); };
  $("#piExport").onclick = exportPlan;
  if (planImportOpen) {
    $("#piCancel").onclick = () => { planImportOpen = false; renderPlan(v); };
    $("#piLoad").onclick = () => importPlanFromText($("#piText").value, v);
    $("#piFile").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importPlanFromText(r.result, v); r.readAsText(f); };
  }
}

function renderPlanEditor(v) {
  const used = usedIds();
  const cat = catalog();
  const inEdit = new Set(planEdit.flatMap(d => d.exercises.map(e => e.id)));
  const archive = Object.values(cat).filter(e => !inEdit.has(e.id) && used.has(e.id));
  const nInp = (di, ei, f, val, lbl, step) => `<label class="f">${lbl}<input inputmode="numeric" data-pe="${f}" data-d="${di}" data-e="${ei}" value="${esc(val ?? "")}"></label>`;
  v.innerHTML = `
    <h2>Edycja planu</h2>
    ${planImportReport ? `<div class="card small" style="border-color:var(--accent)">
      <p style="margin-top:0"><b>Zaimportowany plan – sprawdź go i kliknij „Zapisz plan” na dole.</b></p>
      <p>${planImportReport.days} dni, ${planImportReport.ex} ćwiczeń. <b>${planImportReport.matched.length}</b> kontynuuje historię, <b>${planImportReport.fresh.length}</b> nowych.</p>
      ${planImportReport.matched.length ? `<p class="muted">Z historią: ${esc(planImportReport.matched.join(", "))}</p>` : ""}
      <p class="muted">Ćwiczenia z obecnego planu, których nie ma w nowym, trafią do archiwum z całą historią.</p>
    </div>` : ""}
    <div class="card small">
      <p style="margin-top:0"><b>Twoja historia jest bezpieczna.</b></p>
      <p>• <b>Zmiana nazwy</b> lub serii zachowuje historię tego ćwiczenia (np. poprawka nazwy, inny zakres powtórzeń).</p>
      <p>• <b>Zupełnie inne ćwiczenie?</b> Usuń stare (✕) i dodaj nowe – stare trafi do archiwum z całą historią.</p>
      <p>• Ćwiczenie z archiwum możesz wstawić z powrotem i jego historia się połączy.</p>
    </div>
    ${planEdit.map((d, di) => `
      <div class="card">
        <div class="row between">
          <h3>Dzień ${di + 1}</h3>
          <div class="pe-tools">
            <button class="btn small" data-pa="dayUp" data-d="${di}" ${di === 0 ? "disabled" : ""} aria-label="Przesuń dzień w górę">↑</button>
            <button class="btn small" data-pa="dayDown" data-d="${di}" ${di === planEdit.length - 1 ? "disabled" : ""} aria-label="Przesuń dzień w dół">↓</button>
            <button class="btn small danger" data-pa="dayDel" data-d="${di}" aria-label="Usuń dzień">✕</button>
          </div>
        </div>
        <div class="form-grid" style="margin-top:8px">
          <label>Nazwa dnia<input data-pe="name" data-d="${di}" value="${esc(d.name)}"></label>
          <label>Skrót (przycisk)<input data-pe="short" data-d="${di}" value="${esc(d.short)}" maxlength="12"></label>
          <label>Opis<input data-pe="focus" data-d="${di}" value="${esc(d.focus || "")}"></label>
        </div>
        ${d.exercises.map((e, ei) => `
          <div class="pe-ex">
            <div class="row between" style="align-items:flex-start;flex-wrap:nowrap">
              <label class="f grow">Ćwiczenie ${used.has(e.id) ? `<span class="badge" title="To ćwiczenie ma zapisaną historię">ma historię</span>` : ""}<input data-pe="ex.name" data-d="${di}" data-e="${ei}" value="${esc(e.name)}"></label>
              <div class="pe-tools" style="margin-top:18px">
                <button class="btn small" data-pa="exUp" data-d="${di}" data-e="${ei}" ${ei === 0 ? "disabled" : ""} aria-label="W górę">↑</button>
                <button class="btn small" data-pa="exDown" data-d="${di}" data-e="${ei}" ${ei === d.exercises.length - 1 ? "disabled" : ""} aria-label="W dół">↓</button>
                <button class="btn small danger" data-pa="exDel" data-d="${di}" data-e="${ei}" aria-label="Usuń ćwiczenie">✕</button>
              </div>
            </div>
            <div class="pe-nums">
              ${nInp(di, ei, "ex.sets", e.sets, "Serie")}
              ${nInp(di, ei, "ex.min", e.min, e.unit === "s" ? "Min (s)" : "Min powt.")}
              ${nInp(di, ei, "ex.max", e.max, e.unit === "s" ? "Max (s)" : "Max powt.")}
              ${nInp(di, ei, "ex.rest", e.rest, "Przerwa (s)")}
            </div>
            <div class="pe-flags">
              <label><input type="checkbox" data-pe="ex.side" data-d="${di}" data-e="${ei}" ${e.side ? "checked" : ""}> na stronę</label>
              <label><input type="checkbox" data-pe="ex.bw" data-d="${di}" data-e="${ei}" ${e.bw ? "checked" : ""}> bez ciężaru</label>
              <label><input type="checkbox" data-pe="ex.timed" data-d="${di}" data-e="${ei}" ${e.unit === "s" ? "checked" : ""}> na czas (sekundy)</label>
            </div>
            <label class="f" style="margin-top:8px">Wskazówka<input data-pe="ex.note" data-d="${di}" data-e="${ei}" value="${esc(e.note || "")}"></label>
          </div>`).join("")}
        <div class="row" style="margin-top:10px">
          <button class="btn small" data-pa="exAdd" data-d="${di}">+ Nowe ćwiczenie</button>
          ${archive.length ? `<select data-pa-sel="exFromArchive" data-d="${di}" style="max-width:240px"><option value="">+ Z archiwum (z historią)…</option>${archive.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</select>` : ""}
        </div>
      </div>`).join("")}
    <div class="row" style="margin-bottom:12px"><button class="btn" data-pa="dayAdd">+ Dodaj dzień</button></div>
    <div class="row">
      <button class="btn primary grow" id="peSave">Zapisz plan</button>
      <button class="btn" id="peCancel">Anuluj</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="peDefault">Przywróć domyślny plan</button></div>
  `;
  const get = el => { const d = planEdit[+el.dataset.d]; const e = el.dataset.e != null ? d.exercises[+el.dataset.e] : null; return { d, e }; };
  v.oninput = ev => {
    const el = ev.target.closest("[data-pe]"); if (!el || el.type === "checkbox") return;
    const { d, e } = get(el); const f = el.dataset.pe;
    if (f.startsWith("ex.")) {
      const k = f.slice(3);
      if (["sets", "min", "max", "rest"].includes(k)) e[k] = num(el.value) ?? "";
      else e[k] = el.value;
    } else d[f] = el.value;
  };
  v.onchange = ev => {
    const el = ev.target;
    if (el.matches('[data-pe][type="checkbox"]')) {
      const { e } = get(el); const k = el.dataset.pe.slice(3);
      if (k === "timed") { if (el.checked) e.unit = "s"; else delete e.unit; renderPlanEditor(v); return; }
      if (el.checked) e[k] = true; else delete e[k];
      return;
    }
    if (el.matches("[data-pa-sel]") && el.value) {
      const d = planEdit[+el.dataset.d]; const a = cat[el.value];
      d.exercises.push({ id: a.id, name: a.name, sets: a.sets || 3, min: a.min || 8, max: a.max || 12, rest: a.rest ?? 90, note: a.note || "", ...(a.side ? { side: true } : {}), ...(a.bw ? { bw: true } : {}), ...(a.unit ? { unit: a.unit } : {}) });
      renderPlanEditor(v);
    }
  };
  v.onclick = ev => {
    const b = ev.target.closest("[data-pa]"); if (!b) return;
    const di = +b.dataset.d, ei = +b.dataset.e, act = b.dataset.pa;
    const swap = (arr, i, j) => { [arr[i], arr[j]] = [arr[j], arr[i]]; };
    if (act === "dayUp") swap(planEdit, di, di - 1);
    else if (act === "dayDown") swap(planEdit, di, di + 1);
    else if (act === "dayDel") {
      if (planEdit.length === 1) { toast("Plan musi mieć przynajmniej jeden dzień"); return; }
      if (!confirm(`Usunąć „${planEdit[di].name}” z planu? Zapisane treningi i historia ćwiczeń zostaną.`)) return;
      planEdit.splice(di, 1);
    }
    else if (act === "dayAdd") { const n = planEdit.length + 1; planEdit.push({ id: "day_" + uid(), short: `Dzień ${n}`, name: `Dzień ${n}`, focus: "", exercises: [] }); }
    else if (act === "exUp") swap(planEdit[di].exercises, ei, ei - 1);
    else if (act === "exDown") swap(planEdit[di].exercises, ei, ei + 1);
    else if (act === "exDel") {
      const e = planEdit[di].exercises[ei];
      if (used.has(e.id) && !confirm(`Usunąć „${e.name}” z planu? Historia zostanie w archiwum i dalej zobaczysz ją w Postępie.`)) return;
      planEdit[di].exercises.splice(ei, 1);
    }
    else if (act === "exAdd") planEdit[di].exercises.push({ id: "ex_" + uid(), name: "", sets: 3, min: 8, max: 12, rest: 90, note: "" });
    renderPlanEditor(v);
    if (act === "exAdd") { const ins = v.querySelectorAll(`[data-pe="ex.name"][data-d="${di}"]`); const last = ins[ins.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block: "center" }); } }
  };
  $("#peCancel").onclick = () => { planEdit = null; planImportReport = null; renderPlan(v); };
  $("#peDefault").onclick = () => {
    if (!confirm("Wczytać domyślny plan do edycji? Historia zostaje. Zmiany zapiszesz przyciskiem „Zapisz plan”.")) return;
    planEdit = clone(DEFAULT_DAYS); renderPlanEditor(v);
  };
  $("#peSave").onclick = () => {
    const errs = [];
    if (!planEdit.length) errs.push("Plan musi mieć przynajmniej jeden dzień.");
    planEdit.forEach((d, di) => {
      d.name = (d.name || "").trim() || `Dzień ${di + 1}`; d.short = (d.short || "").trim() || d.name.slice(0, 12);
      if (!d.exercises.length) errs.push(`„${d.name}” nie ma ćwiczeń.`);
      d.exercises.forEach(e => {
        e.name = (e.name || "").trim();
        if (!e.name) errs.push(`W „${d.name}” jest ćwiczenie bez nazwy.`);
        e.sets = Math.max(1, Math.round(num(e.sets) || 1)); e.min = num(e.min) || 1; e.max = num(e.max) || e.min; e.rest = Math.max(0, Math.round(num(e.rest) || 0));
        if (e.min > e.max) [e.min, e.max] = [e.max, e.min];
      });
    });
    const ids = planEdit.flatMap(d => d.exercises.map(e => e.id));
    if (new Set(ids).size !== ids.length) errs.push("To samo ćwiczenie jest w planie dwa razy – użyj go raz albo dodaj nowe.");
    if (errs.length) { toast(errs[0]); return; }
    S.plan = { updatedAt: new Date().toISOString(), days: planEdit };
    planEdit = null; planImportReport = null;
    rebuildIndex();
    if (S.draft && !DAY[S.draft.day]) S.draft = null;
    commit(); render(); toast("Plan zapisany – historia zachowana");
  };
}

let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (tab === "postep" || tab === "waga") render(); }, 200); });
window.addEventListener("beforeunload", e => { if (planEdit) { e.preventDefault(); e.returnValue = ""; } });
tickStopwatch();
render();
scheduleSync(100);
</script>
</body>
</html>
